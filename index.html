<style>

:root{color-scheme:dark;
 --bg:#090C12;--pn:#10151E;--pn2:#0C1018;--ln:#1B2331;--ln2:#283447;--tx:#DCE3EE;--dim:#8592A6;--mut:#566277;
 --up:#FF4D5E;--dn:#3C8DFF;--acc:#F5B83D;--ok:#2ED18B;--warn:#FF9F43;--sel:#18263A;--liq:#B57BFF;
 --f-body:'IBM Plex Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;--f-num:'JetBrains Mono','D2Coding',Consolas,ui-monospace,monospace;--f-disp:'Black Han Sans','IBM Plex Sans KR',sans-serif}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--f-body);font-size:13px;overflow:hidden}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--dim)}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{background:var(--pn2);border:1px solid var(--ln2);border-radius:4px;padding:6px 8px;min-width:0}
.btn{font-weight:700;font-size:12.5px;padding:7px 11px;border-radius:4px;border:1px solid var(--ln2);background:#151D2A;color:var(--tx)}.btn:hover{border-color:var(--acc)}
.btn.buy{background:#4A1820;border-color:#86303B;color:#FFD6DA}.btn.sell{background:#132C52;border-color:#24508F;color:#D2E4FF}.btn.acc{background:#3A2C0E;border-color:#7D5E19;color:var(--acc)}.btn.sm{padding:4px 8px;font-size:11.5px}
.app{height:100%;display:grid;grid-template-rows:auto auto 1fr 250px;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* 상단 */
.top{display:flex;align-items:center;gap:14px;padding:8px 14px;background:#06080D;border-bottom:1px solid var(--ln);flex-wrap:wrap}
.logo{font-family:var(--f-disp);font-size:19px;letter-spacing:.5px;color:#fff;white-space:nowrap}.logo b{color:var(--acc);font-weight:400}
.clock{display:flex;align-items:center;gap:8px}.clock .d{font-family:var(--f-num);font-weight:800;font-size:13px}.clock .t{font-family:var(--f-num);font-size:20px;font-weight:800;color:#fff}
.sess{width:120px;height:6px;border-radius:3px;background:var(--ln);overflow:hidden}.sess i{display:block;height:100%;background:var(--acc)}
.spd{display:inline-flex;border:1px solid var(--ln2);border-radius:4px;overflow:hidden}.spd button{border:0;background:var(--pn2);color:var(--dim);font-weight:800;font-size:12px;padding:6px 9px;border-right:1px solid var(--ln)}.spd button:last-child{border-right:0}.spd button.on{background:#2A3550;color:#fff}
.stats{display:flex;gap:18px;margin-left:auto;flex-wrap:wrap}.stat{display:flex;flex-direction:column;align-items:flex-end}.stat span{font-size:10.5px;color:var(--mut);letter-spacing:.3px}.stat b{font-family:var(--f-num);font-size:15px;font-weight:800}
.news{display:flex;align-items:center;gap:10px;padding:5px 14px;background:#0B0F16;border-bottom:1px solid var(--ln);font-size:12px;overflow:hidden;white-space:nowrap}
.news .lb{font-size:10.5px;font-weight:800;color:#06080D;background:var(--acc);padding:1px 6px;border-radius:3px;flex-shrink:0}.news .tk{overflow:hidden;text-overflow:ellipsis;color:var(--dim)}.news .tk b{color:var(--tx);font-weight:700}
/* 본문 3단 */
.main{display:grid;grid-template-columns:280px minmax(0,1fr) 330px;min-height:0}
.list{background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px 8px 6px}.tabs button{flex:1;border:1px solid var(--ln);background:var(--pn2);color:var(--dim);font-weight:800;font-size:12px;padding:6px 0;border-radius:3px}.tabs button.on{background:var(--sel);color:#fff;border-color:var(--ln2)}
.lq{padding:0 8px 8px}.lq input{width:100%}
.rows{flex:1;overflow:auto}
.rw{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;padding:7px 10px;border-bottom:1px solid #131925;cursor:pointer}.rw:hover{background:#121A26}.rw.on{background:var(--sel);box-shadow:inset 3px 0 0 var(--acc)}
.rw .n{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rw .c{font-size:10.5px;color:var(--mut)}.rw .p{text-align:right;font-family:var(--f-num);font-weight:600}.rw .r{text-align:right;font-family:var(--f-num);font-size:11.5px}
.rw .hold{display:inline-block;font-size:9.5px;font-weight:800;padding:0 4px;border-radius:2px;background:#3A2C0E;color:var(--acc);margin-left:4px}
.flash-up{animation:fu .6s}.flash-dn{animation:fd .6s}@keyframes fu{0%{background:rgba(255,77,94,.35)}to{background:transparent}}@keyframes fd{0%{background:rgba(60,141,255,.35)}to{background:transparent}}.rw .p{border-radius:3px;padding:0 3px}
.center{display:flex;flex-direction:column;min-height:0;min-width:0}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:7px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
.ch .nm{font-size:16px;font-weight:700;color:#fff}.ch .cd{font-size:11px;color:var(--mut)}.ch .px{font-family:var(--f-num);font-size:19px;font-weight:800}.ch .pc{font-family:var(--f-num);font-weight:700}
.seg{display:inline-flex;border:1px solid var(--ln2);border-radius:4px;overflow:hidden}.seg button{border:0;border-right:1px solid var(--ln);background:var(--pn2);color:var(--dim);font-weight:700;font-size:11.5px;padding:5px 9px}.seg button:last-child{border-right:0}.seg button.on{background:#2A3550;color:#fff}
.cw{flex:1;position:relative;min-height:0}#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
.ai{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:6px 12px;background:var(--pn2);border-top:1px solid var(--ln);font-size:12px}.ai b{font-family:var(--f-num)}.ai .k{color:var(--mut);font-size:11px;margin-right:4px}
.pill{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px}.p-up{background:#3D1219;color:#FF8E99}.p-dn{background:#102544;color:#8DBBFF}.p-fl{background:#1C2330;color:var(--dim)}.p-acc{background:#3A2C0E;color:var(--acc)}.p-ok{background:#0F3324;color:var(--ok)}.p-liq{background:#2A1745;color:#D3B2FF}
/* 주문 */
.ord{background:var(--pn);border-left:1px solid var(--ln);overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.ord h4{margin:0;font-size:11.5px;color:var(--dim);font-weight:800;letter-spacing:.3px;display:flex;justify-content:space-between}
.sw{display:flex;border:1px solid var(--ln2);border-radius:5px;overflow:hidden}.sw button{flex:1;border:0;background:var(--pn2);color:var(--dim);font-weight:800;padding:9px 0}.sw button.on-b{background:#5A1C26;color:#fff}.sw button.on-s{background:#173868;color:#fff}.sw button.on-n{background:#2A3550;color:#fff}
.fld{display:flex;flex-direction:column;gap:4px}.fld label{font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between}.fld input{width:100%;font-family:var(--f-num);font-size:14px;padding:8px}
.pct{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.pct button{border:1px solid var(--ln);background:var(--pn2);color:var(--dim);font-weight:700;font-size:11.5px;padding:5px 0;border-radius:3px}.pct button:hover{color:#fff}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px}.kv span:nth-child(odd){color:var(--dim)}.kv span:nth-child(even){text-align:right;font-family:var(--f-num)}
.go{width:100%;font-size:15px;padding:12px 0;font-weight:800;border-radius:5px}
.lev{display:flex;align-items:center;gap:8px}.lev input[type=range]{flex:1;accent-color:var(--acc);padding:0}.lev b{font-family:var(--f-num);font-size:16px;color:var(--acc);min-width:44px;text-align:right}
.warnbox{font-size:11.5px;line-height:1.55;color:var(--dim);background:var(--pn2);border:1px solid var(--ln);border-radius:4px;padding:7px 9px}
.msg{font-size:12px;min-height:16px}
/* 하단 */
.bot{background:var(--pn);border-top:1px solid var(--ln2);display:flex;flex-direction:column;min-height:0}
.bt{display:flex;background:#0A0E15;border-bottom:1px solid var(--ln);overflow-x:auto}.bt button{border:0;background:transparent;color:var(--dim);font-weight:800;font-size:12.5px;padding:8px 14px;white-space:nowrap;border-right:1px solid var(--ln)}.bt button.on{background:var(--pn);color:#fff;box-shadow:inset 0 2px 0 var(--acc)}
.bt .cnt{font-family:var(--f-num);font-size:10.5px;color:var(--acc);margin-left:4px}
.bc{flex:1;overflow:auto;padding:8px 12px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:5px 8px;border-bottom:1px solid #151C28;white-space:nowrap;text-align:right}th{position:sticky;top:0;background:#0E131C;color:var(--dim);font-weight:700;font-size:11.5px}th:first-child,td:first-child{text-align:left}td{font-family:var(--f-num)}td.t{font-family:var(--f-body)}
tbody tr[data-k]{cursor:pointer}tbody tr:hover{background:#121A26}
.empty{color:var(--mut);padding:18px;text-align:center}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}.ach div{border:1px solid var(--ln);border-radius:5px;padding:8px 10px;background:var(--pn2);opacity:.45}.ach div.got{opacity:1;border-color:#7D5E19;background:#1A160C}.ach b{display:block;font-size:12.5px}.ach span{font-size:11px;color:var(--dim)}
/* 모달 */
.mdl{position:fixed;inset:0;background:rgba(3,5,9,.72);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}.mdl[hidden]{display:none!important}
.mdl>div{background:var(--pn);border:1px solid var(--ln2);border-radius:8px;padding:18px 20px;width:min(520px,100%);max-height:90vh;overflow:auto}
.mdl h2{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0 0 4px;color:#fff;letter-spacing:.3px}.mdl p{color:var(--dim);line-height:1.6;margin:6px 0}
.big{font-family:var(--f-num);font-size:30px;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0 12px}.opts button{border:1px solid var(--ln2);background:var(--pn2);color:var(--dim);border-radius:5px;padding:9px 4px;font-weight:700}.opts button.on{border-color:var(--acc);color:#fff;background:#221C0D}.opts small{display:block;font-weight:400;font-size:10.5px;color:var(--mut);margin-top:2px}

 .ord{border-left:0;border-top:1px solid var(--ln)}
 .bot{height:auto;min-height:320px}.bc{max-height:60vh}
 .tbw{overflow-x:auto}
 .perfg{grid-template-columns:minmax(0,1fr)!important}
}
</style>

function stepMin(){ // 1분 진행
 const dt=1/390,sq=Math.sqrt(dt);const z={US:gn()};z.KR=.4*z.US+.917*gn();z.CR=.3*z.US+.954*gn();
 const fr={};for(const f in FAC)fr[f]=FAC[f].sd*VM[ST.mood[f]]*ST.vol*sq*z[f]+ST.drift[f]*dt;
 const mi=ST.min,b5=Math.floor(mi/5);

  P.p=Math.max(P.p*Math.exp(r),u.kind==='kr'?1:1e-5);if(P.p>P.h)P.h=P.p;if(P.p<P.l)P.l=P.p;
  const vol=Math.round((1+Math.abs(r)/(u.iv*sq+1e-9)*.6)*(u.kind==='kr'?2000:u.kind==='coin'?3:500)*(.5+Math.random()));P.v+=vol;
  let c=P.m5[P.m5.length-1];if(!c||c[0]!==b5){c=[b5,P.p,P.p,P.p,P.p,0];P.m5.push(c)}c[2]=Math.max(c[2],P.p);c[3]=Math.min(c[3],P.p);c[4]=P.p;c[5]+=vol}
 ST.fx*=Math.exp(FXSD*sq*gn()*.8-fr.KR*.08);

function rollNews(){const r=Math.random();const sg=Math.random()<.52?1:-1;
 if(r<.62){const cands=UD.filter(u=>u.kind==='kr'||u.kind==='us');const u=pick(cands);const P=U_(u.id);const mag=(.012+Math.random()*.04)*Math.sqrt(u.iv/.018)*Math.sqrt(ST.vol);

function posPnl(p){return p.side*(price(p.k)-p.entry)*p.qty*fxOf(p.k)}
function liqPx(p){const f=fxOf(p.k),I=IM[p.k];const q=p.qty*f;return p.side>0?(p.entry*q-p.margin)/(q*(1-I.mmr)):(p.entry*q+p.margin)/(q*(1+I.mmr))}

function buySpot(k,qty,limitPx){const I=IM[k];const P=price(k);const f=fxOf(k);qty=I.tab==='coin'?+qty.toFixed(6):Math.floor(qty);if(!(qty>0))return'수량을 입력하세요';
 if(limitPx){const lp=fillPx(k,limitPx);if(lp>=P)return buySpot(k,qty);const cost=qty*lp*f*(1+I.fee[0]);if(cost>ST.cash)return'현금이 부족합니다';ST.cash-=cost;ST.orders.push({id:ST.seq++,k,side:1,qty,px:lp,res:cost,d:ST.date,m:ST.min});return'지정가 매수 주문 접수'}
 const px=fillPx(k,P*(1.0003));const cost=qty*px*f;const fee=cost*I.fee[0];if(cost+fee>ST.cash+1e-6)return'현금이 부족합니다';
 ST.cash-=cost+fee;const h=ST.hold[k]||(ST.hold[k]={qty:0,cost:0,avg:0,since:ST.day});h.cost+=cost+fee;h.qty+=qty;h.avg=(h.avg*(h.qty-qty)+px*qty)/h.qty;logT(k,'매수',qty,px,fee,null);
 const tabs=new Set(Object.keys(ST.hold).map(x=>IM[x].tab));if(tabs.has('kr')&&tabs.has('us')&&tabs.has('coin'))unlock('div');newsTrade(k);return null}
function sellSpot(k,qty,limitPx){const I=IM[k];const h=ST.hold[k];if(!h||h.qty<=0)return'보유 수량이 없습니다';qty=Math.min(h.qty,I.tab==='coin'?+qty.toFixed(6):Math.floor(qty));if(!(qty>0))return'수량을 입력하세요';
 const f=fxOf(k);if(limitPx){const lp=fillPx(k,limitPx);if(lp<=price(k))return sellSpot(k,qty);h.qty-=qty;const cb=h.cost*qty/(h.qty+qty);h.cost-=cb;ST.orders.push({id:ST.seq++,k,side:-1,qty,px:lp,res:0,cb,d:ST.date,m:ST.min});if(h.qty<=1e-9)delete ST.hold[k];return'지정가 매도 주문 접수'}
 const px=fillPx(k,price(k)*(1-.0003));const gross=qty*px*f;const fee=gross*I.fee[1];const cb=h.cost*qty/h.qty;const pnl=gross-fee-cb;

 logT(k,'매도',qty,px,fee,pnl);if(pnl>0)unlock('profit');if(pnl>0&&h.since!=null&&ST.day-h.since>=20)unlock('hodl');newsTrade(k,pnl);return null}

 logT(p.k,(why||'청산')+' '+(p.side>0?'롱':'숏')+(frac<1?' '+Math.round(frac*100)+'%':''),q,px,fee,pnl-fee);
 if(pnl-fee>0){if(p.side<0)unlock('short');if(p.lev>=10)unlock('lev10')}

function liquidate(p){const i=ST.pos.indexOf(p);if(i<0)return;const lost=p.margin;ST.pos.splice(i,1);ST.liqs++;logT(p.k,'⚠ 강제 청산 '+(p.side>0?'롱':'숏')+' '+p.lev+'배',p.qty,price(p.k),0,-lost);unlock('liq');toast(`강제 청산: ${IM[p.k].n} ${p.side>0?'롱':'숏'} ${p.lev}배 — 증거금 ${WF(lost)} 손실`,'bad')}
function checkPos(){for(const p of ST.pos.slice()){const I=IM[p.k];const pr=price(p.k);const eqp=p.margin+posPnl(p);const notional=p.qty*pr*fxOf(p.k);

  if(p.sl&&((p.side>0&&pr<=p.sl)||(p.side<0&&pr>=p.sl))){closePos(p.id,1,'손절');toast(`손절 체결: ${I.n}`,'bad');continue}}
 const e=equity();const r=(e/ST.start-1)*100;ST.maxRet=Math.max(ST.maxRet,r);if(r>=10)unlock('r10');if(r>=50)unlock('r50');if(r>=100)unlock('x2');if(r>=900)unlock('x10');

 openM(`<h2>${first?'VALUE 모의투자 리그':'새 게임'}</h2><p>오늘(${GD.at}) 실제 종가와 실제 변동성에서 출발해, 게임이 시장을 빨리 감아 움직입니다. 국내·미국 주식과 코인을 사고팔고, 선물로 레버리지 롱·숏을 잡아 자산을 불려 보세요.</p>
 <b style="font-size:12px;color:var(--dim)">시작 자금</b>${O('oC',DIFF.cash,c,{1e7:'소액',1e8:'기본',1e9:'큰손'})}
 <b style="font-size:12px;color:var(--dim)">변동성</b>${O('oV',DIFF.vol,v,{1:'실제 수준',1.6:'1.6배 출렁',2.5:'2.5배 롤러코스터'})}
 <b style="font-size:12px;color:var(--dim)">뉴스 빈도</b>${O('oN',{1:'보통',2:'많음',3.5:'폭주'},nx,{1:'하루 5개쯤',2:'하루 11개쯤',3.5:'하루 19개쯤'})}
 ${ST&&!first?'<p style="color:var(--warn)">새 게임을 시작하면 지금 진행 중인 게임은 사라집니다(랭킹 기록은 남음).</p>':''}
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">${ST&&!first&&!ST.over?'<button class="btn" id="mNo">계속하기</button>':''}<button class="btn acc" id="mGo">게임 시작</button></div>`);
 const bind=(id,set)=>$$('#'+id+' button').forEach(b=>b.onclick=()=>{$$('#'+id+' button').forEach(x=>x.classList.toggle('on',x===b));set(+b.dataset.v)});bind('oC',x=>c=x);bind('oV',x=>v=x);bind('oN',x=>nx=x);
 if($('#mNo'))$('#mNo').onclick=closeM;$('#mGo').onclick=()=>{newGame(c,v,nx);closeM();TAB='kr';SEL='005930';boot();dayOpen();setSpeed(1);renderAll()}}
function showDay(dret,fund){const e=equity();const best=Object.keys(ST.hold).map(k=>[k,(price(k)/ST.hold[k].avg-1)*100]).sort((a,b)=>b[1]-a[1]);const tn=ST.news.filter(n=>n.d===ST.date&&n.sg).slice(0,4);
 const mv=[['K200','코스피200'],['NDX','나스닥100'],['BTC','비트코인']].map(([id,n])=>{const P=U_(id);const r=(P.p/P.hist.at(-2)[4]-1)*100;return`<span>${n}</span><span class="${CL(r)}">${PCT(r)}</span>`}).join('');
 openM(`<h2>${dstr(ST.date)} 장 마감</h2><div class="big ${CL(dret)}">${PCT(dret)}</div><p style="margin-top:0">오늘 손익 <b class="${CL(e-ST.dayStart)}">${WF(Math.round(e-ST.dayStart))}</b> · 총자산 ${WF(Math.round(e))} · 누적 <span class="${CL(e-ST.start)}">${PCT((e/ST.start-1)*100)}</span></p>
 <div class="kv" style="margin:10px 0">${mv}${fund?`<span>펀딩비</span><span class="${CL(fund)}">${WF(Math.round(fund))}</span>`:''}${best.length?`<span>보유 중 최고</span><span>${H(IM[best[0][0]].n)} ${PCT(best[0][1])}</span>`:''}</div>
 ${tn.length?`<p style="font-size:12px">오늘의 뉴스<br>${tn.map(n=>`<span class="${n.sg>0?'up':'dn'}">${n.sg>0?'▲':'▼'}</span> ${H(n.txt)}`).join('<br>')}</p>`:''}
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn" id="mStay">장 마감 화면 보기</button><button class="btn acc" id="mNext">다음 거래일 시작 ▶</button></div>`);
 $('#mStay').onclick=()=>{closeM();renderAll()};$('#mNext').onclick=()=>{closeM();goNextDay()};renderAll()}
function showBust(){openM(`<h2>파산했습니다</h2><p>총자산이 시작 자금의 1% 아래로 내려갔습니다. ${ST.liqs?`강제 청산 ${ST.liqs}번이 결정타였네요.`:''} 이번 시즌은 랭킹에 기록되었습니다.</p><div class="kv"><span>진행일</span><span>${ST.day}거래일</span><span>최고 수익률</span><span>${PCT(ST.maxRet)}</span><span>거래 횟수</span><span>${ST.trades}회</span></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button class="btn acc" id="mGo">새 게임</button></div>`);$('#mGo').onclick=()=>showSettings()}
function showHelp(){openM(`<h2>도움말</h2><p><b>시간</b> 1× 속도에서 장 하루(09:00~15:30)가 약 2분 반에 흐릅니다. ❚❚ 또는 스페이스로 멈추고, ‘마감까지 ⏭’로 오늘 장을 바로 끝낼 수 있습니다. 장이 끝나면 하루 결산이 나오고 다음 거래일로 넘어갑니다.</p>
 <p><b>가격</b> 오늘(${GD.at}) 실제 종가, 실제 최근 60일 변동성, 시장 지수와의 연동(베타)으로 시작해 무작위로 움직입니다. 시장 분위기(잔잔·보통·폭풍)와 추세가 날마다 바뀌고, 가상 뉴스가 터지면 급등락합니다. 실제 미래 가격이 아닙니다.</p>
 <p><b>현물</b> 국내·미국 주식, 코인을 시장가·지정가로 사고팝니다. 미국 주식과 코인은 달러 가격이며 원화로 자동 환전되고, 환율도 움직입니다.</p>
 <p><b>선물</b> 코스피200·나스닥100·S&P500 선물(최대 10배)과 코인 무기한 선물(최대 20배). 롱은 오를 때, 숏은 내릴 때 돈을 법니다. 증거금 × 레버리지만큼 움직이므로 10배면 1% 움직임이 증거금의 10%입니다. 손실이 유지증거금선까지 가면 강제 청산되어 증거금을 잃습니다. 익절·손절가를 걸어 두면 자동으로 정리됩니다.</p>
 <p><b>AI 신호</b> 게임 속 가격으로 계산한 RSI·스토캐스틱·매수심리입니다. 참고용이며 맞는다는 보장이 없습니다.</p>
 <p><b>저장</b> 진행 상황·업적·랭킹은 이 브라우저에 자동 저장됩니다.</p><div style="display:flex;justify-content:flex-end"><button class="btn acc" id="mOk">확인</button></div>`);$('#mOk').onclick=closeM}
// ====================== 묶음 ======================
function tickRender(){renderTop();updList();if(SEL){renderHead();drawChart();}const now=performance.now();if(now-lastRender>900){lastRender=now;aiSig();if(['hold','pos','open','perf'].includes(BT))renderBot();if(IM[SEL].t==='fut'||ST.hold[SEL])refreshOrderInfo();renderCounts()}}
function refreshOrderInfo(){const a=document.activeElement;if(a&&a.closest&&a.closest('#ord'))return;renderOrder()}
function renderAll(){renderTop();buildList();if(SEL){renderHead();renderOrder();drawChart();aiSig()}renderBot();renderCounts()}
function boot(){$$('#mTabs button').forEach(b=>{b.classList.toggle('on',b.dataset.t===TAB);b.onclick=()=>{TAB=b.dataset.t;$$('#mTabs button').forEach(x=>x.classList.toggle('on',x===b));$('#lQ').value='';buildList();const L=listOf(TAB);if(!L.some(i=>i.k===SEL))selectInst(L[0].k)}});
 if(!SEL||!IM[SEL])SEL=listOf(TAB)[0].k}
$('#lQ').oninput=buildList;
$$('#spd button').forEach(b=>b.onclick=()=>{if(ST&&ST.dayEnd){showDay((equity()/ST.dayStart-1)*100,0);return}setSpeed(b.dataset.s)});
$$('#cTf button').forEach(b=>{b.classList.toggle('on',b.dataset.f===TF);b.onclick=()=>{TF=b.dataset.f;$$('#cTf button').forEach(x=>x.classList.toggle('on',x===b));drawChart()}});
$$('#cInd button').forEach(b=>{b.classList.toggle('on',!!IND[b.dataset.i]);b.onclick=()=>{IND[b.dataset.i]=IND[b.dataset.i]?0:1;b.classList.toggle('on');drawChart()}});
$$('#bTabs button').forEach(b=>{b.classList.toggle('on',b.dataset.b===BT);b.onclick=()=>{BT=b.dataset.b;$$('#bTabs button').forEach(x=>x.classList.toggle('on',x===b));renderBot()}});
$('#bSet').onclick=()=>showSettings();$('#bHelp').onclick=showHelp;
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||!$('#mdl').hidden)return;if(e.code==='Space'){e.preventDefault();setSpeed(SPEED?0:1)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&ST){save();if(SPEED)setSpeed(0)}});
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv.parentElement);window.addEventListener('resize',resize);
// 시작
ST=lsg(SAVE);if(ST&&(!ST.P||ST.v!==1||!ST.P['005930']))ST=null;
if(ST){TAB='kr';SEL='005930';boot();renderAll();resize();setSpeed(0);if(ST.over)showBust();else if(ST.dayEnd)showDay((equity()/ST.dayStart-1)*100,0);else toast('저장된 게임을 이어서 합니다 — ▶ 1× 를 눌러 계속')}
else{newGame(1e8,1,1);TAB='kr';SEL='005930';boot();dayOpen();renderAll();resize();setSpeed(0);showSettings(true)}
requestAnimationFrame(loop);
</script>

</body></html>
